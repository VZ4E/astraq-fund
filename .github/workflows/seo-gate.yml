name: SEO gate

# Read-only release gate: runs scripts/verify-answernorth.py against production.
# Triggers: after every Pages deploy (retrying through the ~10-minute CDN cache),
# on a Mon/Thu schedule, and on demand.

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  schedule:
    - cron: "17 13 * * 1,4"   # Mon/Thu 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify production (retries through CDN cache)
        run: |
          ok=0
          for i in $(seq 1 12); do
            if python3 scripts/verify-answernorth.py https://answernorth.com > verify.log 2>&1; then
              ok=1
              break
            fi
            echo "attempt $i failed; retrying in 60s"
            sleep 60
          done
          cat verify.log
          {
            if [ "$ok" = "1" ]; then
              echo "## SEO gate: PASS"
            else
              echo "## SEO gate: FAIL"
              echo '```'
              grep -E "^(FAIL|skip)" verify.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = "1" ]
